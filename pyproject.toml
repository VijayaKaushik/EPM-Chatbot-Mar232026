requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.13.2",
    "faker>=40.1.0",
    "fastapi>=0.125.0",
    "generativeai>=0.0.1",
    "google-adk>=1.23.0",
    "google-generativeai>=0.8.6",
    "litellm>=1.80.11",
    "numpy>=2.4.0",
    "pandas>=2.3.3",
    "pandasai>=3.0.0",
    "pypdf2>=3.0.1",
